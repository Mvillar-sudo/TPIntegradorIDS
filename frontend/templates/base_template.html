<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Centro Médico Salud Integral{% endblock %}</title>
    <!-- estilos generales -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index_main.css') }}">
    <!-- estilos particulares de cada pantalla -->
    {% block head_extra %}{% endblock %}
</head>

<body class="{% block body_class %}landing is-preload{% endblock %}">
    <div id="page-wrapper">
        <!-- Encabezado y navegación -->
        <header id="header" class="{% block header_class %}alt{% endblock %}">
            <h1>
                <a href="{{ url_for('public.index') }}">Centro Médico Salud Integral</a>
            </h1>
            {% include '_navbar.html' %}
        </header>
        <!-- Contenido de cada página -->
        {% block content %}{% endblock %}
        <!-- Pie de página -->
        <footer id="footer">
            <ul class="copyright">
                <li>Todos los derechos reservados</li>
                <li>
                    Autores:
                    <a href="https://github.com/Mvillar-sudo/TPIntegradorIDS">
                        404 Not Found Group
                    </a>
                </li>
            </ul>
        </footer>

    </div>
    <!-- JavaScript general -->
    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.dropotron.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.scrollex.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/browser.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/breakpoints.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/util.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/formularios.js') }}"></script>
    <!-- JavaScript particular de cada página -->
    {% block scripts %}{% endblock %}

</body>
</html>
