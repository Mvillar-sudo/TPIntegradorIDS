{% extends "admin/base_admin.html" %}

{% block title %}{{ titulo }} | Panel de administrador{% endblock %}

{% block admin_content %}
<div class="admin-titulo">
	<h2>{{ titulo }}</h2>
	<a href="{{ url_for('admin.listado_medicos') }}" class="button">Volver</a>
</div>

<form method="post">
	<div class="row gtr-uniform gtr-50">
		<div class="col-6 col-12-xsmall">
			<input type="text" name="nombre" placeholder="Nombre" required />
		</div>
		<div class="col-6 col-12-xsmall">
			<input type="text" name="apellido" placeholder="Apellido" required />
		</div>
		<div class="col-6 col-12-xsmall">
			<input type="text" name="dni" placeholder="DNI" inputmode="numeric" pattern="[0-9]{7,8}" required />
		</div>
		<div class="col-6 col-12-xsmall">
			<input type="email" name="email" placeholder="Email" required />
		</div>
		<div class="col-6 col-12-xsmall">
			<input type="tel" name="telefono" placeholder="Teléfono" />
		</div>
		<div class="col-6 col-12-xsmall">
			<select name="especialidad" required>
				<option value="">- Especialidad -</option>
				<option>Cardiología</option>
				<option>Pediatría</option>
				<option>Dermatología</option>
			</select>
		</div>
		<div class="col-12">
			<ul class="actions">
				<li><input type="submit" value="Guardar" class="button primary" /></li>
				<li><a href="{{ url_for('admin.listado_medicos') }}" class="button">Cancelar</a></li>
			</ul>
		</div>
	</div>
</form>
{% endblock %}
