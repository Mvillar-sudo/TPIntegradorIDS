{% extends "admin/base_admin.html" %}

{% block title %}{{ titulo }} | Panel de administrador{% endblock %}

{% block admin_content %}
<div class="admin-titulo">
	<h2>{{ titulo }}</h2>
	<a href="{{ url_for('admin.listado_medicos') }}" class="button admin-boton">Volver</a>
</div>

<div class="auth-box auth-registro">

	<div class="auth-cabecera">Datos del médico</div>

	<div class="auth-cuerpo">
		<form method="post">
			<div class="auth-fila">
				<div>
					<label for="nombre">Nombre</label>
					<input type="text" name="nombre" id="nombre" required />
				</div>
				<div>
					<label for="apellido">Apellido</label>
					<input type="text" name="apellido" id="apellido" required />
				</div>
			</div>

			<label for="dni">DNI</label>
			<input type="text" name="dni" id="dni" inputmode="numeric" pattern="[0-9]{7,8}" required />

			<label for="email">Email</label>
			<input type="email" name="email" id="email" required />

			<label for="telefono">Teléfono (opcional)</label>
			<input type="tel" name="telefono" id="telefono" />

			<label for="especialidad">Especialidad</label>
			<select name="especialidad" id="especialidad" required>
				<option value="">- Elegí una especialidad -</option>
				<option>Cardiología</option>
				<option>Pediatría</option>
				<option>Dermatología</option>
			</select>

			<input type="submit" value="Guardar" class="auth-boton" />
		</form>

		<p class="auth-subtitulo"><a href="{{ url_for('admin.listado_medicos') }}">Cancelar</a></p>
	</div>

</div>
{% endblock %}
